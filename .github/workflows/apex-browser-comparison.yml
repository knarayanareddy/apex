name: Apex one-shot browser comparison

on:
  pull_request:
    paths:
      - '.github/workflows/apex-browser-comparison.yml'

permissions:
  contents: read

jobs:
  comparison:
    # Four fresh runners, once on this PR commit; not a qualification gate.
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/apex-safety-recovery' && github.event.pull_request.commits == 31 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        browser: [chromium, google-chrome]
    defaults:
      run:
        working-directory: pi-apex-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: pi-apex-harness/package-lock.json
      - name: Record test revision and browser selection
        run: |
          git rev-parse HEAD
          test -x "/usr/bin/${{ matrix.browser }}"
      - name: Install locked dependencies
        run: npm ci
      - name: Build native bridge
        run: npm run build:native
      - name: Run one observed browser comparison
        env:
          APEX_COMPARE_REQUIRE_SUCCESS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 test/ring7/trace_browser_ci.py --compare /usr/bin/${{ matrix.browser }}
