name: DIAGNOSTIC ONLY - exact Apex PTY commit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-k-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pi-apex-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: c25d416a5af1b02571f68b4ede02277a1199bdc6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: pi-apex-harness/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = c25d416a5af1b02571f68b4ede02277a1199bdc6
      - name: Build native bridge
        run: npm run build:native
      - name: Typecheck and JavaScript inventory
        run: |
          npm run typecheck
          npm run check:js
      - name: Provision Ubuntu bubblewrap on disposable runner
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/apex-bubblewrap"
          mkdir -p "$stage"
          cd "$stage"
          if [[ '${{ matrix.os }}' == 'ubuntu-22.04' ]]; then
            base=https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap
            curl -fsSLO "$base/bubblewrap_0.9.0-1ubuntu0.3.dsc"
            curl -fsSLO "$base/bubblewrap_0.9.0.orig.tar.xz"
            curl -fsSLO "$base/bubblewrap_0.9.0.orig.tar.xz.asc"
            curl -fsSLO "$base/bubblewrap_0.9.0-1ubuntu0.3.debian.tar.xz"
            printf '%s  %s\n' \
              c8e38ca3ed20c269fc7e79a069fb329c0928ad7efaca098b07b50f7283599f24 bubblewrap_0.9.0-1ubuntu0.3.dsc \
              c6347eaced49ac0141996f46bba3b089e5e6ea4408bc1c43bab9f2d05dd094e1 bubblewrap_0.9.0.orig.tar.xz \
              355568011016d6d5592c13830778a9b06365926f6478ae43e51b2ab5c3bc3c92 bubblewrap_0.9.0.orig.tar.xz.asc \
              4d6c71db380bb69d19a09501bd5caec92e46bf54c7f505805e75687daf783939 bubblewrap_0.9.0-1ubuntu0.3.debian.tar.xz | sha256sum -c -
            dpkg-source --require-strong-checksums -x bubblewrap_0.9.0-1ubuntu0.3.dsc source
            while IFS= read -r patch; do
              [[ -z "$patch" || "$patch" == \#* ]] && continue
              grep -Fx "$patch" source/.pc/applied-patches
            done < source/debian/patches/series
            mkdir deps
            apt-get download meson libcap-dev libcap2 libselinux1-dev libselinux1 libsepol-dev libsepol2 libpcre2-dev libpcre2-8-0
            for package in ./*.deb; do
              test -f "$package"
              sha256sum "$package"
              dpkg-deb -x "$package" deps
            done
            export PYTHONPATH="$stage/deps/usr/lib/python3/dist-packages"
            export PKG_CONFIG_PATH="$stage/deps/usr/lib/x86_64-linux-gnu/pkgconfig"
            export DEB_BUILD_MAINT_OPTIONS=hardening=+pie,+bindnow
            export CFLAGS="$(dpkg-buildflags --get CFLAGS) -I$stage/deps/usr/include"
            export LDFLAGS="$(dpkg-buildflags --get LDFLAGS) -L$stage/deps/usr/lib/x86_64-linux-gnu -L$stage/deps/lib/x86_64-linux-gnu"
            /usr/bin/python3 "$stage/deps/usr/bin/meson" setup build source --prefix=/usr -Dselinux=enabled
            ninja -C build bwrap
            candidate="$stage/build/bwrap"
          else
            apt-cache policy bubblewrap
            apt-get download bubblewrap
            packages=(bubblewrap_*.deb)
            test "${#packages[@]}" -eq 1
            test -f "${packages[0]}"
            sha256sum "${packages[0]}"
            dpkg-deb -x "${packages[0]}" root
            candidate="$stage/root/usr/bin/bwrap"
          fi
          test -x "$candidate"
          help_text="$("$candidate" --help)"
          [[ "$help_text" == *--size* ]]
          test ! -e /usr/bin/bwrap && test ! -L /usr/bin/bwrap
          sudo install -m 0755 -o root -g root "$candidate" /usr/bin/bwrap
          cmp "$candidate" /usr/bin/bwrap
          sha256sum /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Allow bubblewrap user namespaces on disposable runner
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          set -euo pipefail
          umask 077
          userns_before="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          unconfined_before="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined)"
          profile="$RUNNER_TEMP/apex-ci-bwrap.apparmor"
          test ! -e "$profile" && test ! -L "$profile"
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile apex-ci-bwrap /usr/bin/bwrap flags=(unconfined) {' \
            '  userns,' \
            '}' > "$profile"
          sudo apparmor_parser -a "$profile"
          sudo grep -F 'apex-ci-bwrap' /sys/kernel/security/apparmor/profiles
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "$userns_before"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined)" = "$unconfined_before"
      - name: Create isolated diagnostic fixture directory
        run: |
          diagnostic_tmp="$RUNNER_TEMP/apex-batchk-evidence"
          test ! -e "$diagnostic_tmp"
          mkdir -m 700 "$diagnostic_tmp"
          printf 'TMPDIR=%s\n' "$diagnostic_tmp" >> "$GITHUB_ENV"
      - name: Run exact-commit security canaries
        run: npm run test:canaries
      - name: Run exact-commit Linux ownership and installed-artifact gates
        run: npm run test:linux
      - name: Verify exact-commit Ring 2 user flows
        run: npm run test:ring2
      - name: Stress Batch K only - not release qualification
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            printf 'DIAGNOSTIC_ONLY batch-k iteration=%s/20\n' "$iteration"
            npm run test:batchK
          done
          printf 'DIAGNOSTIC_ONLY 20 Batch K processes exited normally; browser and release gates NOT run.\n'
      - name: Preserve diagnostic fixtures on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apex-batchk-diagnostic-${{ github.run_id }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/apex-batchk-evidence/apex-pty-cancel-effect-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-batch-k-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-bwrap-sync-control-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pty-pipe-control-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pid1-candidate-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pid1-parent-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pid1-detached-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pty-owned-regression-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pty-manager-parent-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pty-detached-*
            ${{ runner.temp }}/apex-batchk-evidence/apex-pty-package-*
          if-no-files-found: ignore
          retention-days: 7
