name: DIAGNOSTIC ONLY - Chrome for Testing browser suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-startup-comparison:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        condition: [chrome-for-testing]
        replicate: [1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        working-directory: pi-apex-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c25d416a5af1b02571f68b4ede02277a1199bdc6
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: pi-apex-harness/package-lock.json
      - name: Verify feature revision
        run: test "$(git rev-parse HEAD)" = c25d416a5af1b02571f68b4ede02277a1199bdc6
      - name: Install locked dependencies
        run: npm ci
      - name: Build native bridge
        run: npm run build:native
      - name: Verify diagnostic observer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/diagnostic-source/pi-apex-harness/node_modules"
          ln -s "$GITHUB_WORKSPACE/pi-apex-harness/node_modules" "$GITHUB_WORKSPACE/diagnostic-source/pi-apex-harness/node_modules"
          python3 "$GITHUB_WORKSPACE/diagnostic-source/pi-apex-harness/test/ring7/test_trace_browser_ci.py"
          python3 "$GITHUB_WORKSPACE/diagnostic-source/.github/diagnostics/test_cft_cold.py"
      - name: Record metadata without launching a browser
        run: |
          set -euo pipefail
          binary="/usr/bin/chromium"
          test -x "$binary"
          resolved="$(readlink -f "$binary")"
          printf 'DIAGNOSTIC_METADATA binary=%s resolved=%s\n' "$binary" "$resolved"
          stat -Lc 'size=%s dev=%d inode=%i' "$resolved"
          if test -f /opt/google/chrome/chrome; then stat -Lc 'chrome_elf_size=%s dev=%d inode=%i' /opt/google/chrome/chrome; fi
          uname -sr
          df -T "$resolved" "$RUNNER_TEMP"
          cat /proc/pressure/io
          cat /proc/pressure/cpu
      - name: Download pinned full Chrome for Testing into owned fixture
        if: ${{ matrix.condition == 'chrome-for-testing' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apex-cft.zip"
          dir="$RUNNER_TEMP/apex-cft"
          test ! -e "$archive" && test ! -L "$archive"
          test ! -e "$dir" && test ! -L "$dir"
          curl -fLsS --proto '=https' --tlsv1.2 --max-time 180 \
            'https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip?generation=1793228525740273' \
            -o "$archive"
          test "$(stat -c %s "$archive")" = 201329937
          printf '%s  %s\n' 6a158ba7e01da016f1988bae0643d9e5 "$archive" | md5sum -c -
          printf '%s  %s\n' b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7 "$archive" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/diagnostic-source/.github/diagnostics/cft_cold.py" --check-archive "$archive"
          mkdir -m 700 "$dir"
          unzip -qq "$archive" -d "$dir"
          test -x "$dir/chrome-linux64/chrome"
      - name: Full browser suite once - diagnostic only
        id: observe
        env:
          PI_APEX_REQUIRE_BROWSER: '1'
          PI_APEX_CHROMIUM_BIN: ${{ runner.temp }}/apex-cft/chrome-linux64/chrome
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/diagnostic-source/.github/diagnostics/cft_cold.py" 2>&1 | tee "$RUNNER_TEMP/apex-cft-cold.log"
          python3 "$GITHUB_WORKSPACE/diagnostic-source/pi-apex-harness/test/ring7/trace_browser_ci.py" 2>&1 | tee "$RUNNER_TEMP/apex-browser-observation.log"
      - name: Preserve diagnostic output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-cft-${{ matrix.os }}-${{ matrix.condition }}-${{ matrix.replicate }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apex-browser-observation.log
            ${{ runner.temp }}/apex-cft-cold.log
          if-no-files-found: ignore
          retention-days: 7
