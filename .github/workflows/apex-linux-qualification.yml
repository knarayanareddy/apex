name: DIAGNOSTIC ONLY - fresh runner browser comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-startup-comparison:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        binary: [chromium, google-chrome]
        replicate: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    defaults:
      run:
        working-directory: pi-apex-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c25d416a5af1b02571f68b4ede02277a1199bdc6
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: pi-apex-harness/package-lock.json
      - name: Verify feature revision
        run: test "$(git rev-parse HEAD)" = c25d416a5af1b02571f68b4ede02277a1199bdc6
      - name: Install locked dependencies
        run: npm ci
      - name: Build native bridge
        run: npm run build:native
      - name: Record metadata without launching a browser
        run: |
          set -euo pipefail
          binary="/usr/bin/${{ matrix.binary }}"
          test -x "$binary"
          resolved="$(readlink -f "$binary")"
          printf 'DIAGNOSTIC_METADATA binary=%s resolved=%s\n' "$binary" "$resolved"
          stat -Lc 'size=%s dev=%d inode=%i' "$resolved"
          if test -f /opt/google/chrome/chrome; then stat -Lc 'chrome_elf_size=%s dev=%d inode=%i' /opt/google/chrome/chrome; fi
          uname -sr
          df -T "$resolved" "$RUNNER_TEMP"
          cat /proc/pressure/io
          cat /proc/pressure/cpu
      - name: One cold-start observation - not qualification
        id: observe
        env:
          APEX_COMPARE_REQUIRE_SUCCESS: '1'
          APEX_COMPARE_TIMEOUT_MS: '60000'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python3 test/ring7/trace_browser_ci.py --compare "/usr/bin/${{ matrix.binary }}" 2>&1 | tee "$RUNNER_TEMP/apex-browser-observation.log"
      - name: Record version after observation
        if: ${{ !cancelled() && steps.observe.outcome != 'skipped' }}
        run: timeout 8s "/usr/bin/${{ matrix.binary }}" --version || echo 'DIAGNOSTIC_VERSION_UNAVAILABLE'
      - name: Preserve diagnostic output
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-compare-${{ matrix.os }}-${{ matrix.binary }}-${{ matrix.replicate }}-${{ github.run_id }}
          path: ${{ runner.temp }}/apex-browser-observation.log
          if-no-files-found: ignore
          retention-days: 7
