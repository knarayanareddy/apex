name: DIAGNOSTIC ONLY - Apex Batch K hang

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-k-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pi-apex-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: pi-apex-harness/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build native bridge
        run: npm run build:native
      - name: Provision Ubuntu bubblewrap on disposable runner
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/apex-bubblewrap"
          mkdir -p "$stage"
          cd "$stage"
          apt-cache policy bubblewrap
          apt-get download bubblewrap
          packages=(bubblewrap_*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          sha256sum "${packages[0]}"
          dpkg-deb -x "${packages[0]}" root
          candidate="$stage/root/usr/bin/bwrap"
          test -x "$candidate"
          help_text="$("$candidate" --help)"
          [[ "$help_text" == *--size* ]]
          test ! -e /usr/bin/bwrap && test ! -L /usr/bin/bwrap
          sudo install -m 0755 -o root -g root "$candidate" /usr/bin/bwrap
          cmp "$candidate" /usr/bin/bwrap
          sha256sum /usr/bin/bwrap
          /usr/bin/bwrap --version
      - name: Allow bubblewrap user namespaces on disposable runner
        run: |
          set -euo pipefail
          umask 077
          userns_before="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          unconfined_before="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined)"
          profile="$RUNNER_TEMP/apex-ci-bwrap.apparmor"
          test ! -e "$profile" && test ! -L "$profile"
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile apex-ci-bwrap /usr/bin/bwrap flags=(unconfined) {' \
            '  userns,' \
            '}' > "$profile"
          sudo apparmor_parser -a "$profile"
          sudo grep -F 'apex-ci-bwrap' /sys/kernel/security/apparmor/profiles
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "$userns_before"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined)" = "$unconfined_before"
      - name: Compare inherited pipes under actual bubblewrap
        run: node --experimental-strip-types test/diagnostics/pty-retained-pipes.ts
      - name: Compare bubblewrap monitor exit and sandbox-lifetime EOF
        run: node --experimental-strip-types test/diagnostics/bwrap-sync-fd-probe.ts
      - name: Reproduce security canary sequence - diagnostic only
        run: npm run test:canaries
      - name: Stress Batch K only - not release qualification
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            printf 'DIAGNOSTIC_ONLY batch-k iteration=%s/20\n' "$iteration"
            npm run test:batchK
          done
          printf 'DIAGNOSTIC_ONLY 20 Batch K processes exited normally; browser and release gates NOT run.\n'
